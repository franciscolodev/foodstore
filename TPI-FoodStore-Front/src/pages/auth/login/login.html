<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Store - Login</title>
<style>
    body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    }
    .form-container {
    background: white;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 350px;
    }
    h2 { margin-top: 0; text-align: center; color: #333; }
    label { display: block; margin: 15px 0 5px; color: #666; }
    input {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
    }
    button {
    width: 100%;
    padding: 10px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    margin-top: 20px;
    cursor: pointer;
    font-weight: bold;
    }
    button:hover { background-color: #0056b3; }
    .link-registro { text-align: center; margin-top: 15px; font-size: 14px; }
    .link-registro a { color: #007bff; text-decoration: none; }
    #log-mensaje { font-size: 14px; text-align: center; margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>

<div class="form-container">
    <h2>Iniciar Sesión</h2>
    <form id="form-login">
    <div>
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required autocomplete="off" placeholder="example@example.com">
    </div>
    <div>
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required autocomplete="off" placeholder="********">
    </div>

    <button type="submit">Ingresar</button>
    </form>

    <p id="log-mensaje"></p>

    <div class="link-registro">
    ¿Todavía no tenés cuenta? <a href="../registro/registro.html">Registrate acá</a>
    </div>
</div>

<script type="module" src="./login.ts"></script>
</body>
</html>
