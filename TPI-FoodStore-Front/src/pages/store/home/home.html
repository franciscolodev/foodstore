<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodStore - Catálogo</title>
    <link rel="stylesheet" href="../../../style.css">
    <style>
        .layout-tienda { display: flex; padding: 30px 50px; gap: 40px; }
        .panel-izquierdo { width: 220px; flex-shrink: 0; }
        .panel-izquierdo h2 { font-size: 0.8rem; text-transform: uppercase; color: #9ca3af; letter-spacing: 1px; margin-bottom: 15px; }
        .panel-izquierdo ul { list-style: none; padding: 0; margin: 0; }
        .panel-izquierdo li { padding: 10px 15px; border-radius: 20px; cursor: pointer; color: #4b5563; font-size: 0.95rem; margin-bottom: 5px; }
        .panel-izquierdo li:hover { background-color: #e5e7eb; }
        .panel-izquierdo li.active { background-color: #1b382b; color: white; font-weight: bold; }

        .seccion-principal { flex-grow: 1; }
        .buscador-redondo { width: 100%; max-width: 350px; padding: 12px 20px; border-radius: 25px; border: 1px solid #d1d5db; font-size: 0.95rem; outline: none; margin-bottom: 35px; background-color: white; }

        .cuadrilla-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; }
        .tarjeta-plato { background: white; border-radius: 16px; padding: 20px; border: 1px solid #e4e7eb; display: flex; flex-direction: column; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.01); }
        .tarjeta-plato img { max-width: 140px; height: 140px; object-fit: contain; align-self: center; margin-bottom: 15px; border-radius: 50%; }
        .tarjeta-plato .tag-cat { font-size: 0.75rem; color: #9ca3af; text-transform: uppercase; font-weight: bold; margin-bottom: 5px; }
        .tarjeta-plato h4 { margin: 5px 0; font-size: 1.1rem; color: #111827; font-weight: 600; }
        .tarjeta-plato p { font-size: 0.85rem; color: #6b7280; line-height: 1.4; margin: 0 0 20px 0; flex-grow: 1; }
        
        .fila-compra { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .fila-compra .precio { font-size: 1.15rem; font-weight: 700; color: #111827; }
        
        .btn-comprar { background-color: #1b382b; color: white; border: none; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: background 0.2s; }
        .btn-comprar:hover { background-color: #142a20; }
        .btn-bloqueado { background-color: #e5e7eb; color: #9ca3af; border: none; padding: 8px 18px; border-radius: 20px; cursor: not-allowed; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header class="navbar-store">
        <div class="brand">🍔FoodStore</div>
        <nav>
            <a href="#" class="active">Catálogo</a>
            <a href="../cart/cart.html">Carrito <span class="cart-nav-pill" id="nav-total-badge">0</span></a>
        </nav>
    </header>

    <div class="layout-tienda">
        <aside class="panel-izquierdo">
            <h2>Categorías</h2>
            <ul id="ul-lista-categorias">
                <li class="active" id="btn-mostrar-todo">Todos los productos</li>
            </ul>
        </aside>

        <main class="seccion-principal">
            <div style="display: flex; align-items: center;">
                <input type="text" id="campo-busqueda" class="buscador-redondo" placeholder="🔍 Buscar productos...">
                
                <select id="selector-ordenamiento" class="buscador-redondo" style="max-width: 200px; margin-left: 15px; cursor: pointer; margin-bottom: 35px;">
                    <option value="default">Ordenar por...</option>
                    <option value="az">Nombre: A - Z</option>
                    <option value="za">Nombre: Z - A</option>
                    <option value="precio-menor">Precio: Menor a Mayor</option>
                    <option value="precio-mayor">Precio: Mayor a Menor</option>
                </select>
            </div>
            
            <section class="cuadrilla-items" id="grid-productos-target"></section>
            
            <div id="sin-resultados" style="display: none; text-align: center; padding: 50px; color: #6b7280;">
                <h3>No hay productos que coincidan con los filtros aplicados.</h3>
            </div>
        </main>
    </div>

    <script type="module" src="./home.ts"></script>
</body>
</html>
