<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodStore - Detalle del Producto</title>
    <link rel="stylesheet" href="../../../style.css">
    <style>
        .contenedor-detalle { max-width: 900px; margin: 40px auto; background: white; border-radius: 16px; border: 1px solid #e4e7eb; padding: 40px; display: flex; gap: 40px; }
        .detalle-imagen { flex: 1; max-width: 400px; height: 350px; object-fit: contain; border-radius: 12px; }
        .detalle-info { flex: 1; display: flex; flex-direction: column; }
        .detalle-info .tag-cat { font-size: 0.85rem; color: #9ca3af; text-transform: uppercase; font-weight: bold; margin-bottom: 10px; }
        .detalle-info h2 { margin: 0 0 15px 0; font-size: 1.8rem; color: #111827; }
        .detalle-info .descripcion { color: #6b7280; font-size: 1rem; line-height: 1.5; margin-bottom: 25px; }
        .detalle-info .precio { font-size: 1.6rem; font-weight: 700; color: #111827; margin-bottom: 20px; }
        .detalle-info .stock-info { font-size: 0.9rem; color: #10b981; font-weight: 600; margin-bottom: 20px; }
        .detalle-info .stock-info.sin-stock { color: #ef4444; }
        
        .fila-acciones { display: flex; align-items: center; gap: 20px; margin-top: auto; }
        .selector-cantidad { padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; font-size: 1rem; width: 80px; text-align: center; outline: none; }
        
        .btn-agregar { background-color: #1b382b; color: white; border: none; padding: 12px 28px; border-radius: 25px; cursor: pointer; font-weight: 600; font-size: 1rem; transition: background 0.2s; }
        .btn-agregar:hover { background-color: #142a20; }
        .btn-volver { color: #4b5563; text-decoration: none; font-weight: 600; font-size: 0.95rem; display: inline-flex; align-items: center; margin-bottom: 20px; }
        .btn-volver:hover { color: #111827; }
    </style>
</head>
<body>

    <header class="navbar-store">
        <div class="brand">🍔FoodStore</div>
        <nav>
            <a href="../home/home.html">Catálogo</a>
            <a href="../cart/cart.html">Carrito <span class="cart-nav-pill" id="nav-total-badge">0</span></a>
        </nav>
    </header>

    <div style="max-width: 900px; margin: 30px auto 0 auto; padding: 0 40px;">
        <a href="../home/home.html" class="btn-volver">← Volver al catálogo</a>
    </div>

    <main class="contenedor-detalle" id="detalle-wrapper">
        <div style="text-align: center; width: 100%; color: #6b7280; padding: 40px;">
            <h3>Cargando información del plato...</h3>
        </div>
    </main>

    <script type="module" src="./productDetail.ts"></script>
</body>
</html>
